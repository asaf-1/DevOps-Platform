# The demo app. Phase 2's `make break` edits the image tag and the memory
# limit in this file (in git, never live) so a real alert fires.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-app
    team: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-app
          image: ghcr.io/asaf-1/devops-platform/demo-app:sha-87efedf
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          # The ConfigMap is mounted as files (refreshed live by the kubelet)
          # and also exposed as env for anything that only reads the env.
          envFrom:
            - configMapRef:
                name: demo-app-config
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: demo-app-config
