# The app's own policy allows egress to DNS only. On this platform it also
# talks to its Postgres, so egress to the CNPG pods on 5432 is added. The
# list replaces the base's (egress rules have no merge key).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agents-playground
  namespace: agents-playground  # the base namespace; the overlay moves everything to bank
spec:
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: bank
      ports:
        - protocol: TCP
          port: 5432
