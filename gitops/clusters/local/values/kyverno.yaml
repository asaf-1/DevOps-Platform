# Kyverno, one replica of each controller. Policies live in
# infra/policies/kyverno/ and arrive in Phase 3.

# The CRD migration hook job rewrites the CRDs' metadata after every sync,
# which fights ArgoCD. This is a fresh install, nothing to migrate.
crds:
  migration:
    enabled: false

admissionController:
  replicas: 1
  container:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
backgroundController:
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
cleanupController:
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
reportsController:
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
