# kind cluster for the local platform. Created by scripts/up.sh:
#   kind create cluster --name platform --config gitops/clusters/local/kind.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platform
# kind 0.33.0's default node image, pinned by digest (Kubernetes 1.37.0).
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    # ingress-nginx runs on this node (label below) with hostPort 80/443 in
    # the node container; these mappings expose them on the host as
    # 8080/8443, because port 80 on the host is often taken (IIS on Windows).
    # URLs are therefore http://argocd.localhost:8080 and
    # http://grafana.localhost:8080.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
      # LocalStack Service of type NodePort 30566 -> host 4566, so the AWS CLI
      # and Terraform on the host (or in the devcontainer through
      # host.docker.internal) use http://localhost:4566 as usual.
      - containerPort: 30566
        hostPort: 4566
        protocol: TCP
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
