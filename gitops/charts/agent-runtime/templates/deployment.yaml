apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: platform
    team: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime
        app.kubernetes.io/part-of: platform
    spec:
      serviceAccountName: agent-runtime
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MODEL_PROVIDER
              value: {{ .Values.model.provider | quote }}
            - name: MODEL_NAME
              value: {{ .Values.model.name | quote }}
            - name: OLLAMA_BASE_URL
              value: {{ .Values.model.ollamaBaseUrl | quote }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.model.anthropicSecretName }}
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.uriKey }}
            - name: PLATFORM_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.secretName }}
                  key: {{ .Values.github.tokenKey }}
                  optional: true
            - name: GITHUB_REPO
              value: {{ .Values.github.repo | quote }}
            - name: GRAFANA_URL
              value: {{ .Values.grafana.url | quote }}
            - name: GRAFANA_PUBLIC_URL
              value: {{ .Values.grafana.publicUrl | quote }}
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.secretName }}
                  key: {{ .Values.grafana.tokenKey }}
                  optional: true
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            # The MCP servers export their own traces too; our collector endpoint is OTLP/HTTP.
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_SERVICE_NAME
              value: agent-runtime
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: agent-runtime
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: platform
spec:
  selector:
    app.kubernetes.io/name: agent-runtime
  ports:
    - name: http
      port: 8080
      targetPort: http
