# The apply worker runs the kubernetes Terraform provider for k8s-namespace
# requests, so it may manage namespaces, quotas and limit ranges, nothing
# else. This is the human-approved path; the agents (Phase 2) get a
# separate, read-only ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-api.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-api-provisioner
  labels:
    {{- include "platform-api.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [resourcequotas, limitranges]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-api-provisioner
  labels:
    {{- include "platform-api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-api-provisioner
subjects:
  - kind: ServiceAccount
    name: platform-api
    namespace: {{ .Release.Namespace }}
