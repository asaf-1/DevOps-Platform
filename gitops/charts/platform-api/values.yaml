# Platform API + apply worker. The image tag is bumped by build.yml after
# every push to main that changes platform/.
image:
  repository: ghcr.io/asaf-1/devops-platform/platform-api
  tag: "sha-5b0af94"
  pullPolicy: Always

replicaCount: 1

ingress:
  enabled: true
  className: nginx
  host: platform.localhost

# CloudNativePG creates this Secret for the "platform" cluster; key "uri" is
# postgresql://user:password@host:5432/platform.
database:
  secretName: platform-app
  uriKey: uri

# Created by scripts/up.sh from PLATFORM_GITHUB_TOKEN in .env, never in git.
github:
  repo: asaf-1/DevOps-Platform
  baseBranch: main
  secretName: platform-github
  tokenKey: token

worker:
  enabled: true
  intervalSeconds: 30
  localstackEndpoint: http://localstack.localstack.svc.cluster.local:4566

api:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

workerResources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 768Mi
