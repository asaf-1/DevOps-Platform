# The agent runtime, from the chart in this repo. Same namespace as the
# platform API (platform); reads only the namespaces listed in its values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-runtime
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/asaf-1/DevOps-Platform.git
    targetRevision: main
    path: gitops/charts/agent-runtime
    helm:
      releaseName: agent-runtime
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
