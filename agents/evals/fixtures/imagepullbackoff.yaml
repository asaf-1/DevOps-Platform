name: imagepullbackoff
description: The image tag in git does not exist; the pod never starts. Fix the one line.
alert:
  status: firing
  fingerprint: fx-imagepull-01
  labels:
    alertname: DemoAppImagePullBackOff
    severity: critical
    namespace: demo
    pod: demo-app-6d8f9c7b5-x2k4q
    container: demo-app
    app: demo-app
  annotations:
    summary: demo-app-6d8f9c7b5-x2k4q cannot pull its image
    description: "Container demo-app in demo/demo-app-6d8f9c7b5-x2k4q is in ImagePullBackOff; the image tag in gitops/apps/demo-app/deployment.yaml probably does not exist."
files:
  gitops/apps/demo-app/deployment.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: demo-app
      namespace: demo
      labels:
        app.kubernetes.io/name: demo-app
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: demo-app
      template:
        metadata:
          labels:
            app.kubernetes.io/name: demo-app
        spec:
          containers:
            - name: demo-app
              image: ghcr.io/asaf-1/devops-platform/demo-app:does-not-exist
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 8080
              envFrom:
                - configMapRef:
                    name: demo-app-config
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: http
tools:
  kubernetes.kubectl_describe:
    - when: {resourceType: pod}
      returns: |
        Name:             demo-app-6d8f9c7b5-x2k4q
        Namespace:        demo
        Node:             platform-control-plane/172.18.0.2
        Labels:           app.kubernetes.io/name=demo-app
        Status:           Pending
        Controlled By:    ReplicaSet/demo-app-6d8f9c7b5
        Containers:
          demo-app:
            Image:          ghcr.io/asaf-1/devops-platform/demo-app:does-not-exist
            Port:           8080/TCP
            State:          Waiting
              Reason:       ImagePullBackOff
            Ready:          False
            Limits:
              memory:  64Mi
            Requests:
              cpu:     10m
              memory:  32Mi
        Events:
          Type     Reason   Age               From     Message
          ----     ------   ---               ----     -------
          Normal   Pulling  2m (x4 over 3m)   kubelet  Pulling image "ghcr.io/asaf-1/devops-platform/demo-app:does-not-exist"
          Warning  Failed   2m (x4 over 3m)   kubelet  Failed to pull image "ghcr.io/asaf-1/devops-platform/demo-app:does-not-exist": not found
          Warning  Failed   2m (x4 over 3m)   kubelet  Error: ErrImagePull
          Normal   BackOff  1m (x6 over 3m)   kubelet  Back-off pulling image "ghcr.io/asaf-1/devops-platform/demo-app:does-not-exist"
          Warning  Failed   1m (x6 over 3m)   kubelet  Error: ImagePullBackOff
  kubernetes.kubectl_get:
    - when: {resourceType: pod}
      returns: |
        NAME                        READY   STATUS             RESTARTS   AGE
        demo-app-6d8f9c7b5-x2k4q    0/1     ImagePullBackOff   0          3m
  kubernetes.kubectl_logs:
    - returns: "Error from server (BadRequest): container demo-app is waiting to start: image cannot be pulled"
expect:
  keywords: ["does-not-exist"]
  keywords_any: ["main", "tag"]
  changed_file: gitops/apps/demo-app/deployment.yaml
  replace_contains: "demo-app:main"
  pr: true
  max_steps: 8
