name: wrong_service_port
description: The Service in git targets a port the container does not listen on; no endpoints, the app is unreachable. Fix the targetPort.
alert:
  status: firing
  fingerprint: fx-svc-port-01
  labels:
    alertname: DemoAppUnavailable
    severity: warning
    namespace: demo
    deployment: demo-app
    app: demo-app
  annotations:
    summary: demo-app has no ready endpoints
    description: "Service demo/demo-app has had no endpoints for 2 minutes; the ingress returns 503."
files:
  gitops/apps/demo-app/deployment.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: demo-app
      namespace: demo
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: demo-app
      template:
        metadata:
          labels:
            app.kubernetes.io/name: demo-app
        spec:
          containers:
            - name: demo-app
              image: ghcr.io/asaf-1/devops-platform/demo-app:sha-ae38845
              ports:
                - name: http
                  containerPort: 8080
  gitops/apps/demo-app/service.yaml: |
    apiVersion: v1
    kind: Service
    metadata:
      name: demo-app
      namespace: demo
    spec:
      selector:
        app.kubernetes.io/name: demo-app
      ports:
        - name: http
          port: 80
          targetPort: 8081
tools:
  kubernetes.kubectl_describe:
    - when: {resourceType: pod}
      returns: |
        Name:             demo-app-6d8f9c7b5-h7g6f
        Namespace:        demo
        Status:           Running
        Containers:
          demo-app:
            Image:          ghcr.io/asaf-1/devops-platform/demo-app:sha-ae38845
            Port:           8080/TCP
            State:          Running
            Ready:          True
        Events:           <none>
    - when: {resourceType: service}
      returns: |
        Name:              demo-app
        Namespace:         demo
        Selector:          app.kubernetes.io/name=demo-app
        Type:              ClusterIP
        IP:                10.96.113.42
        Port:              http  80/TCP
        TargetPort:        8081/TCP
        Endpoints:         <none>
        Events:            <none>
    - when: {resourceType: deployment}
      returns: |
        Name:                   demo-app
        Namespace:              demo
        Replicas:               1 desired | 1 updated | 1 total | 1 available | 0 unavailable
        Pod Template:
          Containers:
           demo-app:
            Image:      ghcr.io/asaf-1/devops-platform/demo-app:sha-ae38845
            Port:       8080/TCP
  kubernetes.kubectl_get:
    - when: {resourceType: pod}
      returns: |
        NAME                        READY   STATUS    RESTARTS   AGE
        demo-app-6d8f9c7b5-h7g6f    1/1     Running   0          20m
    - when: {resourceType: endpoints}
      returns: |
        NAME       ENDPOINTS   AGE
        demo-app   <none>      20m
    - when: {resourceType: service}
      returns: |
        NAME       TYPE        CLUSTER-IP     PORT(S)   AGE
        demo-app   ClusterIP   10.96.113.42   80/TCP    20m
  kubernetes.kubectl_logs:
    - returns: |
        2026-10-25T09:20:01Z INFO demo-app listening on :8080
expect:
  keywords_any: ["8081", "targetport", "target port"]
  changed_file: gitops/apps/demo-app/service.yaml
  replace_contains: "8080"
  pr: true
  max_steps: 10
