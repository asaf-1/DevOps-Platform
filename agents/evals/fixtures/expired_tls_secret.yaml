name: expired_tls_secret
description: The Ingress in git points at an expired certificate secret while a valid one exists. Point it at the valid secret.
alert:
  status: firing
  fingerprint: fx-tls-01
  labels:
    alertname: DemoAppTLSExpired
    severity: warning
    namespace: demo
    ingress: demo-app
    app: demo-app
  annotations:
    summary: demo-app serves an expired certificate
    description: "The TLS certificate served for demo.localhost expired on 2025-10-20; browsers show NET::ERR_CERT_DATE_INVALID."
files:
  gitops/apps/demo-app/ingress.yaml: |
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: demo-app
      namespace: demo
    spec:
      ingressClassName: nginx
      tls:
        - hosts: [demo.localhost]
          secretName: demo-app-tls-2025
      rules:
        - host: demo.localhost
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: demo-app
                    port:
                      number: 80
  gitops/apps/demo-app/deployment.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: demo-app
      namespace: demo
    spec:
      template:
        spec:
          containers:
            - name: demo-app
              image: ghcr.io/asaf-1/devops-platform/demo-app:sha-ae38845
tools:
  kubernetes.kubectl_get:
    - when: {resourceType: secret}
      returns: |
        NAME                 TYPE                DATA   AGE
        demo-app-tls         kubernetes.io/tls   2      3d
        demo-app-tls-2025    kubernetes.io/tls   2      370d
    - when: {resourceType: ingress}
      returns: |
        NAME       CLASS   HOSTS            ADDRESS     PORTS     AGE
        demo-app   nginx   demo.localhost   localhost   80, 443   370d
    - when: {resourceType: certificate}
      returns: |
        NAME           READY   SECRET         AGE
        demo-app-tls   True    demo-app-tls   3d
    - when: {resourceType: pod}
      returns: |
        NAME                        READY   STATUS    RESTARTS   AGE
        demo-app-6d8f9c7b5-t1s2l    1/1     Running   0          3d
  kubernetes.kubectl_describe:
    - when: {resourceType: ingress}
      returns: |
        Name:             demo-app
        Namespace:        demo
        Ingress Class:    nginx
        TLS:
          demo-app-tls-2025 terminates demo.localhost
        Rules:
          Host            Path  Backends
          demo.localhost  /     demo-app:80 (10.244.0.31:8080)
        Events:
          Type     Reason  Age                 From                      Message
          ----     ------  ----                ----                      -------
          Warning  Sync    2m (x40 over 5d)    nginx-ingress-controller  certificate in secret demo/demo-app-tls-2025 expired on 2025-10-20T10:00:00Z
    - when: {resourceType: secret, name: demo-app-tls-2025}
      returns: |
        Name:         demo-app-tls-2025
        Namespace:    demo
        Type:         kubernetes.io/tls
        Annotations:  cert-manager.io/certificate-name: demo-app-tls-2025 (certificate deleted)
        Data
        ====
        tls.crt:  1 (notAfter=Oct 20 10:00:00 2025 GMT)
        tls.key:  1
    - when: {resourceType: secret, name: demo-app-tls}
      returns: |
        Name:         demo-app-tls
        Namespace:    demo
        Type:         kubernetes.io/tls
        Annotations:  cert-manager.io/certificate-name: demo-app-tls
        Data
        ====
        tls.crt:  1 (notAfter=Jan 23 10:00:00 2027 GMT)
        tls.key:  1
    - when: {resourceType: pod}
      returns: |
        Name:     demo-app-6d8f9c7b5-t1s2l
        Status:   Running
        Ready:    True
  kubernetes.kubectl_logs:
    - returns: |
        2026-10-25T09:50:00Z INFO demo-app healthy
expect:
  keywords_any: ["expired", "certificate", "tls"]
  changed_file: gitops/apps/demo-app/ingress.yaml
  replace_contains: "demo-app-tls"
  pr: true
  max_steps: 10
