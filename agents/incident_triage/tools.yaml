# Tools the incident-triage agent may call, as "<server>.<tool>". Every
# entry is checked against agents/tools/capabilities.yaml at startup:
# cluster tools must be read; github write is the proposal mechanism.
#
# Kept deliberately small: every tool's JSON schema is prompt tokens on a
# CPU model (about 40 tokens/s of prompt processing on this laptop).
# Grafana queries and git_log come back when the model is faster or hosted.
allowed_tools:
  # look at the cluster (read only)
  - kubernetes.kubectl_get
  - kubernetes.kubectl_describe
  - kubernetes.kubectl_logs
  # read the desired state in git and propose a change
  - github.get_file_contents
  - github.create_branch
  - github.create_or_update_file
  - github.create_pull_request
